<mat-card class="setup-card">

    <mat-card-header class="card-header-center">
        <div class="title-block">
            <mat-card-title class="mat-headline-1">
                Endorsements
            </mat-card-title>

            <mat-card-subtitle>
                View company and HMO endorsements
            </mat-card-subtitle>
        </div>
    </mat-card-header>

    <mat-card-content>

        @if (loading()) {
            <p class="message">
                Loading endorsements...
            </p>
        }

        @else if (errorMessage()) {
            <p class="error-message">
                {{ errorMessage() }}
            </p>
        }

        @else if (endorsements(); as ds) {

            @if (ds.length === 0) {
                <p class="message">
                    No endorsements found.
                </p>
            }

            @else {
                <app-generic-data-table
                    [columnDefs]="columns"
                    [data]="ds"
                    [showAddButton]="false">
                </app-generic-data-table>
            }

        }

    </mat-card-content>

</mat-card>
